<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.webmanifest">
<title>物掌柜 · 安装</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#0f1115;color:#eef2fb;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.c{text-align:center;max-width:320px}
.c h1{font-size:40px;margin-bottom:8px}
.c h2{font-size:20px;margin-bottom:4px}
.c p{font-size:13px;color:#a0a8c0;margin-bottom:20px;line-height:1.6}
.c a{display:block;padding:18px;background:#4f8cff;color:#fff;border-radius:14px;font-size:18px;font-weight:700;text-decoration:none;margin-bottom:10px}
.c .tip{font-size:11px;color:#6b7280;line-height:1.5}
.c .alt{display:block;padding:12px;background:transparent;color:#a0a8c0;border:1px solid #2a2e3a;border-radius:12px;font-size:14px;text-decoration:none;margin-top:8px}
</style>
</head>
<body>
<div class="c">
<h1 id="ico">📦</h1>
<h2 id="title">物掌柜 · 安装到桌面</h2>
<p id="desc">家庭物品 · 资金 · 借贷 · 人情往来</p>
<a id="mainBtn" href="index.html">打开物掌柜</a>
<div class="tip" id="tip"></div>
<a class="alt" href="index.html">直接进入（不安装）</a>
</div>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
var os='';
var ua=navigator.userAgent;
if(/iPhone|iPad/i.test(ua)) os='ios';
else if(/Android/i.test(ua)) os='android';
else if(/Mac/i.test(ua)) os='mac';
else if(/Windows/i.test(ua)) os='win';

if(os==='ios'){
  document.getElementById('ico').textContent='📱';
  document.getElementById('mainBtn').textContent='添加到主屏幕';
  document.getElementById('tip').innerHTML='① 点击上方按钮在 Safari 打开<br>② 点底部 ↑ 分享 → 添加到主屏幕<br>③ 桌面出现图标，完成 ✅';
}else if(os==='android'){
  document.getElementById('ico').textContent='🤖';
  document.getElementById('mainBtn').textContent='安装到桌面';
  document.getElementById('tip').innerHTML='① 点击上方按钮在 Chrome 打开<br>② Chrome 自动弹出安装提示<br>③ 桌面出现图标，完成 ✅';
}else if(os==='mac'){
  document.getElementById('ico').textContent='💻';
  document.getElementById('mainBtn').textContent='安装到程序坞';
  document.getElementById('tip').innerHTML='① 点击上方按钮在 Chrome 打开<br>② 等 3 秒，地址栏右侧出现 ⊕<br>③ 点击 ⊕ → 程序坞出现图标 ✅';
}else if(os==='win'){
  document.getElementById('ico').textContent='🪟';
  document.getElementById('mainBtn').textContent='安装到桌面';
  document.getElementById('tip').innerHTML='① 点击上方按钮在 Chrome 打开<br>② 等 3 秒，地址栏右侧出现 ⊕<br>③ 点击 ⊕ → 桌面出现图标 ✅';
}else{
  document.getElementById('tip').innerHTML='请用 Chrome / Safari / Edge 打开';
}
</script>
</body>
</html>
