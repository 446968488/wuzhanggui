<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <title>物掌柜 · StuffManage</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/styles.css?v=32">
</head>
<body>
  <header class="topbar">
    <div class="brand">📦 物掌柜 <span class="brand-en">StuffManage</span></div>
    <div class="brand-ver" style="display:none">v=32</div>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <main id="view"></main>

  <!-- 一键截图分享浮动按钮 -->
  <button id="shareFab" class="fab" data-action="open-share" title="截图分享">📷<span>截图</span></button>

  <!-- 条码打印专用区（默认隐藏，打印时显示） -->
  <div id="printArea" aria-hidden="true"></div>

  <script src="lib/JsBarcode.all.min.js?v=3"></script>
  <script src="lib/html2canvas.min.js?v=1"></script>
  <script src="js/db.js?v=3"></script>
  <script src="js/crypto.js?v=3"></script>
  <script src="js/app.js?v=32"></script>
  <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}</script>
  <script>
  // 安装引导：浏览器原生弹安装提示
  (function(){
    if(window.matchMedia('(display-mode:standalone)').matches) return;
    var d;
    window.addEventListener('beforeinstallprompt',function(e){
      e.preventDefault(); d=e;
      var b=document.createElement('div');
      b.id='install-banner';
      b.innerHTML='<div style="position:fixed;bottom:20px;left:16px;right:16px;background:#1a1d28;border:1px solid #4f8cff;border-radius:14px;padding:16px;z-index:9999;display:flex;align-items:center;gap:12px;box-shadow:0 8px 30px rgba(0,0,0,.5)"><span style="font-size:28px">📦</span><div style="flex:1;font-size:13px;line-height:1.5;color:#eef2fb"><b>收藏到桌面</b><br><span style="color:#a0a8c0">扫码即用，数据安全本地保存</span></div><button id="do-install" style="padding:10px 20px;background:#4f8cff;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer">安装</button><button id="close-install" style="background:transparent;border:none;color:#6b7280;font-size:18px;cursor:pointer;padding:4px">✕</button></div>';
      document.body.appendChild(b);
      document.getElementById('do-install').onclick=function(){
        d.prompt();d.userChoice.then(function(r){if(r.outcome==='accepted')b.remove();});d=null;
      };
      document.getElementById('close-install').onclick=function(){b.remove();};
    });
    window.addEventListener('appinstalled',function(){var b=document.getElementById('install-banner');if(b)b.remove();});
  })();
  </script>
</body>
</html>
